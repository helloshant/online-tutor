services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* vars are inlined into the client JS bundle at build
        # time, so they must be passed as build args, not just as runtime
        # env vars (env_file/environment below only affect the running
        # container, which is too late for these two). Sourced from
        # .env.local via `docker compose --env-file .env.local ...` -- the
        # `:?` fails the build loudly instead of silently baking in
        # "undefined" if that flag is forgotten.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set NEXT_PUBLIC_SUPABASE_URL in .env.local, and run compose with --env-file .env.local}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Set NEXT_PUBLIC_SUPABASE_ANON_KEY in .env.local, and run compose with --env-file .env.local}
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      # Always resolve to the compose-network hostname here, regardless of
      # whatever ORCHESTRATOR_URL/PAYMENT_URL a local (non-Docker)
      # .env.local might have for `npm run dev`.
      ORCHESTRATOR_URL: http://orchestrator:4000
      PAYMENT_URL: http://payment:4200
    depends_on:
      orchestrator:
        condition: service_healthy
      payment:
        condition: service_healthy
    restart: unless-stopped

  orchestrator:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    env_file:
      - ./services/orchestrator/.env.local
    environment:
      PORT: 4000
      # Always the compose-network hostname, regardless of whatever
      # REDIS_URL / OBSERVABILITY_URL a local (non-Docker) .env.local might
      # have.
      REDIS_URL: redis://redis:6379
      OBSERVABILITY_URL: http://observability:4100
    depends_on:
      redis:
        condition: service_healthy
      observability:
        condition: service_healthy
    # Deliberately no `ports:` mapping -- this service is reachable only
    # from other containers on the compose network (i.e. `web`), never
    # from the host or the public internet directly. Use
    # `docker compose exec orchestrator wget -qO- localhost:4000/health`
    # to check it from your host if needed.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # L1 cache for the orchestrator's answer pipeline. No `ports:` mapping
    # or persistent volume -- purely an in-network cache, safe to lose on
    # restart (the Postgres answer bank is the durable copy).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  observability:
    build:
      context: ./services/observability
      dockerfile: Dockerfile
    env_file:
      - ./services/observability/.env.local
    environment:
      PORT: 4100
    # Deliberately no `ports:` mapping -- same internal-only pattern as
    # `orchestrator`. Only `orchestrator` reports events to this service.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4100/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  payment:
    build:
      context: ./services/payment
      dockerfile: Dockerfile
    env_file:
      - ./services/payment/.env.local
    environment:
      PORT: 4200
    # Deliberately no `ports:` mapping -- same internal-only pattern as
    # `orchestrator`/`observability`. CCAvenue itself never reaches this
    # container directly; it redirects the customer's browser to `web`'s
    # public /api/ccavenue/callback route, which forwards the request here
    # over the compose network.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4200/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
